# py-pc-precom-all-def.yaml
name: py-pc-precom-all-def

on:
  workflow_call:
    inputs:
      python_version:
        description: "Python version for pre-commit"
        type: string
        default: "3.13"

jobs:
  Pre-Commit:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["${{ inputs.python_version }}"]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run pre-commit checks
        uses: pre-commit/action@v3.0.1
