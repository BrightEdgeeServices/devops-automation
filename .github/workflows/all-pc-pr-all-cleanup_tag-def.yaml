# all-pc-pr-all-cleanup_tag-def.yaml
name: all-pc-pr-all-cleanup_tag-def

on:
  workflow_call:
    inputs:
      tag_oid:
        description: "Object ID detected before CI and PR creation"
        type: string
    # secrets:
    #   GH_REPO_ACCESS_BEE_MASTER:
    #     required: true
    #   GH_REPO_ACCESS_RTE_MASTER:
    #     required: true
jobs:
  Cleanup-Delete-pr-Tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the pr tag if it still belongs to this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_TAG_OID: ${{ inputs.tag_oid }}
        run: |
          if [[ -z "$EXPECTED_TAG_OID" ]]; then
            echo "No tag object was recorded. Skipping pr tag cleanup."
            exit 0
          fi

          remote="https://x-access-token:${GH_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git_dir=$(mktemp -d)
          git init --quiet "$git_dir"
          if git -C "$git_dir" push --force-with-lease="refs/tags/pr:$EXPECTED_TAG_OID" "$remote" :refs/tags/pr; then
            exit 0
          fi

          current_tag=$(git ls-remote --refs "$remote" refs/tags/pr)
          if [[ -z "$current_tag" ]]; then
            echo "The pr tag is already absent."
          elif [[ "${current_tag%%$'\t'*}" != "$EXPECTED_TAG_OID" ]]; then
            echo "A different request owns the pr tag. Skipping cleanup."
          else
            echo "Could not delete this run's pr tag." >&2
            exit 1
          fi
